[package]
name = "dochestra-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "dochestra_engine"
path = "src/lib.rs"

[[bin]]
name = "dochestra-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "alloc"] }
petgraph = "0.8.3"
pgvector = { version = "0.4.2", features = ["sqlx"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl", "chrono-impl", "serde-json-impl"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
